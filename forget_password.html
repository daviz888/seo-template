<!DOCTYPE html <html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SEO Admin Panel</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Glassmorphism card for the reset form */
        .reset-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .reset-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .reset-subtitle {
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            color: #e0e0e0;
        }

        .reset-btn {
            background: linear-gradient(135deg, hsl(210, 70%, 55%), hsl(210, 70%, 45%));
            color: #fff;
            border: none;
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, hsl(210, 70%, 60%), hsl(210, 70%, 50%));
        }

        .login-link {
            color: #a0c4ff;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="assets/images/logo.png" alt="SEO Logo" class="login-logo">
                <h1 class="login-title">SEO Admin Panel</h1>
                <p class="login-subtitle">Reset Your Password</p>
            </div>
            <div class="reset-card">
                <h2 class="reset-title">Forgot Password?</h2>
                <p class="reset-subtitle">Enter the email associated with your account and we’ll send you a link to
                    reset your password.</p>
                <form class="reset-form">
                    <div class="form-group">
                        <label for="reset-email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="reset-email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <button type="submit" class="reset-btn">Send Reset Link</button>
                </form>
                <div style="margin-top:1rem; text-align:center;">
                    <a href="login.html" class="login-link">← Back to Sign In</a>
                </div>
            </div>
            <div class="login-footer">
                <p>&copy; 2026 SEO Admin Panel</p>
            </div>
        </div>
    </div>
    <script>
        // Simple placeholder handler – in a real app you would call an API.
        document.querySelector('.reset-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            alert('If an account exists for ' + email + ', a reset link has been sent.');
            // Redirect back to login after a short pause
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        });
    </script>
</body>

</html>
